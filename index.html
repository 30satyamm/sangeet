lass="tab active" data-cat="english">English</button>
  <button class="tab" data-cat="bhojpuri">Bhojpuri</button>
  <button class="tab" data-cat="bollywood">Bollywood</button>
  <button class="tab" data-cat="bollynew">New Bollywood</button>
  <button class="tab" data-cat="hindi90">90s Hindi</button>
  <button class="tab" data-cat="favorites">★ Favorites</button>
</div>

<div class="search-row">
  <input type="text" id="searchInput" placeholder="Search song, or paste a YouTube link…" />
  <button class="icon-btn" id="searchBtn" title="Find">🔍</button>
</div>
<div class="search-hint" id="searchHint" style="display:none;"></div>

<div class="player-card">
  <div class="vinyl-wrap">
    <div class="vinyl" id="vinyl">
      <div class="vinyl-label" id="vinylLabel">♪</div>
    </div>
  </div>

  <div class="now-playing">
    <div id="songTitle">Tap play to start shuffling</div>
    <div id="songMeta">&nbsp;</div>
  </div>

  <div class="video-frame">
    <div id="ytPlayer"></div>
  </div>
  <div class="audio-wave" id="audioWave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div id="favEmptyState" class="empty-state" style="display:none;">
    <span class="star">★</span>
    No favorites yet — while a song is playing, tap the star below to save it here.
  </div>

  <div class="controls">
    <button class="ctrl-btn btn-shuffle" id="shuffleBtn" title="Play another random song">🔀</button>
    <button class="ctrl-btn btn-play" id="playBtn" title="Play / Pause">▶</button>
    <button class="ctrl-btn btn-fav" id="favBtn" title="Add to favorites">☆</button>
  </div>

  <div class="status-line">
    <span class="dot idle" id="statusDot"></span>
    <span id="statusText">Ready</span>
  </div>
</div>

<footer>Dev by Satyam</footer>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  // Curated public YouTube playlists — each has many songs, so playback
  // never runs out, and shuffle picks a genuinely random track every time.
  const PLAYLISTS = {
    english:     { name: 'English',        list: 'PLPSCssPYXhWTTcpNZwYoEQWt8Wc8KO0NV' },
    bhojpuri:    { name: 'Bhojpuri',       list: 'PLNz4YQwT4-GKHmRJq--M9pnuBFlQWhkaw' },
    bollywood:   { name: 'Bollywood',      list: 'PLVPrO2TUSZdTwyg4z7Yw17A3Lly_ELWwy' },
    bollynew:    { name: 'New Bollywood',  list: 'PLO7-VO1D0_6NmK47v6tpOcxurcxdW-hZa' },
    hindi90:     { name: '90s Hindi',      list: 'PLcggtav10zeqaqM2nFaXkjCJe9cFYnZS0' },
  };

  const FAV_KEY = 'satyam_music_favorites_v1';
  function getFavorites() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e) { return []; } }
  function saveFavorites(list) { localStorage.setItem(FAV_KEY, JSON.stringify(list)); }

  let player = null;
  let playerReady = false;
  let currentCategory = 'english';
  let lastIndex = -1;
  let pendingAutoplay = false;
  let currentVideoId = null;
  let currentVideoTitle = '';
  let inSearchMode = false; // true when the currently playing song came from a pasted link


  const els = {
    title: document.getElementById('songTitle'),
    meta: document.getElementById('songMeta'),
    playBtn: document.getElementById('playBtn'),
    shuffleBtn: document.getElementById('shuffleBtn'),
    favBtn: document.getElementById('favBtn'),
    vinyl: document.getElementById('vinyl'),
    statusDot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    favEmpty: document.getElementById('favEmptyState'),
    videoFrame: document.querySelector('.video-frame'),
    searchInput: document.getElementById('searchInput'),
    searchBtn: document.getElementById('searchBtn'),
    searchHint: document.getElementById('searchHint'),
  };

  function setStatus(text, live) {
    els.statusText.textContent = text;
    els.statusDot.classList.toggle('idle', !live);
  }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('ytPlayer', {
      height: '100%', width: '100%',
      playerVars: { rel: 0, playsinline: 1 },
      events: {
        onReady: () => { playerReady = true; if (pendingAutoplay) { pendingAutoplay = false; loadCategory(currentCategory, true); } },
        onStateChange: onPlayerStateChange,
        onError: () => { setStatus('Skipped a song that could not play — tap shuffle for another', false); playRandomFromCurrent(); }
      }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  function onPlayerStateChange(e) {
    const card = document.querySelector('.player-card');
    if (e.data === YT.PlayerState.PLAYING) {
      els.playBtn.textContent = '❚❚';
      els.vinyl.classList.add('spinning');
      card.classList.add('is-playing');
      document.getElementById('audioWave').classList.add('playing');
      setStatus('Playing', true);
      const data = player.getVideoData();
      currentVideoId = data.video_id;
      currentVideoTitle = data.title || 'Now playing';
      els.title.textContent = currentVideoTitle;
      els.meta.textContent = inSearchMode ? 'Search result' : (PLAYLISTS[currentCategory] ? PLAYLISTS[currentCategory].name : 'Favorites');
      updateFavButton();
    } else if (e.data === YT.PlayerState.PAUSED) {
      els.playBtn.textContent = '▶';
      els.vinyl.classList.remove('spinning');
      card.classList.remove('is-playing');
      document.getElementById('audioWave').classList.remove('playing');
      setStatus('Paused', false);
    } else if (e.data === YT.PlayerState.ENDED) {
      // Unlimited random playback — automatically continue with another track.
      playRandomFromCurrent();
    } else if (e.data === YT.PlayerState.BUFFERING) {
      setStatus('Loading…', true);
    }
  }

  let loadRequestId = 0; // guards against a late callback from a previous tab switch overriding a newer one

  function loadCategory(cat, autoplay) {
    inSearchMode = false;
    hideHint();
    currentCategory = cat;
    lastIndex = -1;
    els.favEmpty.style.display = 'none';
    els.videoFrame.style.display = 'block';
    const myRequestId = ++loadRequestId;

    if (!playerReady) { pendingAutoplay = true; return; }

    if (cat === 'favorites') {
      const favs = getFavorites();
      if (!favs.length) {
        els.favEmpty.style.display = 'block';
        els.videoFrame.style.display = 'none';
        els.title.textContent = 'No favorites yet';
        els.meta.textContent = '\u00A0';
        player.stopVideo();
        els.vinyl.classList.remove('spinning');
        els.playBtn.textContent = '▶';
        setStatus('Ready', false);
        return;
      }
      const ids = favs.map(f => f.id);
      player.cuePlaylist({ playlist: ids, index: 0 });
      if (autoplay) waitForPlaylistThenPlay(myRequestId, ids.length, 0);
      return;
    }

    const pl = PLAYLISTS[cat];
    player.cuePlaylist({ listType: 'playlist', list: pl.list });
    if (autoplay) waitForPlaylistThenPlay(myRequestId, null, 0, pl.list);
  }

  // Polls until the player has actually finished loading the intended
  // playlist (checked via getPlaylistId for named playlists, or the
  // expected item count for a custom favorites list) before picking a
  // random track — this is what prevents the previous tab's songs from
  // playing under the newly-selected tab's name.
  function waitForPlaylistThenPlay(requestId, expectedCount, attempt, expectedPlaylistId) {
    if (requestId !== loadRequestId) return; // a newer tab switch has already superseded this one
    if (!playerReady || !player.getPlaylist) return;

    const list = player.getPlaylist();
    const idMatches = !expectedPlaylistId || (player.getPlaylistId && player.getPlaylistId() === expectedPlaylistId);
    const countMatches = expectedCount === null || (list && list.length === expectedCount);

    if (list && list.length && idMatches && countMatches) {
      playRandomFromCurrent();
      return;
    }
    if (attempt >= 25) {
      // Gave it ~5 seconds — proceed with whatever loaded rather than getting stuck silently.
      playRandomFromCurrent();
      return;
    }
    setTimeout(() => waitForPlaylistThenPlay(requestId, expectedCount, attempt + 1, expectedPlaylistId), 200);
  }

  function playRandomFromCurrent() {
    if (!playerReady) return;
    // A pasted link is a single song, not a list — shuffle just falls back
    // to the currently selected tab's playlist instead.
    if (inSearchMode) inSearchMode = false;
    if (!player.getPlaylist) return;
    const list = player.getPlaylist();
    if (!list || !list.length) {
      // Playlist metadata not ready yet — try again shortly.
      setTimeout(playRandomFromCurrent, 500);
      return;
    }
    let idx = Math.floor(Math.random() * list.length);
    if (list.length > 1 && idx === lastIndex) idx = (idx + 1) % list.length;
    lastIndex = idx;
    player.playVideoAt(idx);
  }

  // ---------- Search (no API key — uses YouTube's own search page) ----------
  // Accepts a full YouTube link, a youtu.be short link, or a bare 11-char
  // video ID, and pulls the video ID out of it directly, no API involved.
  function extractVideoId(input) {
    const s = input.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s; // bare video ID
    try {
      const url = new URL(s);
      if (url.hostname.includes('youtu.be')) {
        return url.pathname.slice(1, 12) || null;
      }
      if (url.hostname.includes('youtube.com')) {
        if (url.searchParams.get('v')) return url.searchParams.get('v');
        const m = url.pathname.match(/\/(embed|shorts)\/([a-zA-Z0-9_-]{11})/);
        if (m) return m[2];
      }
    } catch (e) { /* not a URL */ }
    return null;
  }

  function showHint(html) {
    els.searchHint.style.display = 'block';
    els.searchHint.innerHTML = html;
  }
  function hideHint() { els.searchHint.style.display = 'none'; }

  function runSearch() {
    const raw = els.searchInput.value.trim();
    if (!raw) return;

    const videoId = extractVideoId(raw);
    if (videoId) {
      playPastedVideo(videoId);
      return;
    }

    // Plain text — open YouTube's real search in a new tab, since that's
    // more complete and reliable than anything we could build without a key.
    const url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(raw);
    window.open(url, '_blank');
    showHint('Opened YouTube search in a new tab. Tap the song you want, copy its link from the address bar, then paste it back in this box and hit 🔍 again to play it here.');
  }

  function playPastedVideo(videoId) {
    if (!playerReady) return;
    inSearchMode = true;
    currentCategory = null;
    els.favEmpty.style.display = 'none';
    els.videoFrame.style.display = 'block';
    hideHint();
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    player.loadVideoById(videoId);
    els.searchInput.value = '';
  }

  els.searchBtn.addEventListener('click', runSearch);
  els.searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });


  function updateFavButton() {
    const favs = getFavorites();
    const isFav = currentVideoId && favs.some(f => f.id === currentVideoId);
    els.favBtn.textContent = isFav ? '★' : '☆';
    els.favBtn.classList.toggle('active', isFav);
  }

  function toggleFavorite() {
    if (!currentVideoId) return;
    let favs = getFavorites();
    const idx = favs.findIndex(f => f.id === currentVideoId);
    if (idx >= 0) {
      favs.splice(idx, 1);
    } else {
      favs.unshift({ id: currentVideoId, title: currentVideoTitle });
      favs = favs.slice(0, 200); // keep it sane
    }
    saveFavorites(favs);
    updateFavButton();
  }

  // Tabs
  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const vinylLabel = document.getElementById('vinylLabel');
    vinylLabel.className = 'vinyl-label c-' + btn.dataset.cat;
    loadCategory(btn.dataset.cat, true);
  });

  // Play/pause button — also acts as the first "start" tap.
  els.playBtn.addEventListener('click', () => {
    if (!playerReady) { pendingAutoplay = true; return; }
    const state = player.getPlayerState ? player.getPlayerState() : -1;
    if (currentVideoId === null) {
      loadCategory(currentCategory, true);
    } else if (state === YT.PlayerState.PLAYING) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  });

  els.shuffleBtn.addEventListener('click', () => {
    if (!playerReady) return;
    playRandomFromCurrent();
  });

  els.favBtn.addEventListener('click', toggleFavorite);

  // ---------- Greeting (time-of-day message + date) ----------
  function renderGreeting() {
    const now = new Date();
    const hour = now.getHours();
    let msg, icon, mood;
    if (hour >= 5 && hour < 12) { msg = 'Good Morning'; icon = '☀️'; mood = 'morning'; }
    else if (hour >= 12 && hour < 17) { msg = 'Good Afternoon'; icon = '🌤️'; mood = 'afternoon'; }
    else if (hour >= 17 && hour < 21) { msg = 'Good Evening'; icon = '🌇'; mood = 'evening'; }
    else { msg = 'Good Night'; icon = '🌙'; mood = 'night'; }

    const dateStr = now.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    document.getElementById('greetingMsg').textContent = msg + ' — time for some music';
    document.getElementById('greetingDate').textContent = dateStr;
    document.getElementById('greetingIcon').textContent = icon;
    const card = document.getElementById('greetingCard');
    card.classList.remove('morning', 'afternoon', 'evening', 'night');
    card.classList.add(mood);
  }
  function renderClock() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true });
    document.getElementById('greetingTime').textContent = timeStr;
  }
  renderGreeting();
  renderClock();
  setInterval(renderGreeting, 60000); // keep the message/date fresh across hour/day changes
  setInterval(renderClock, 1000);     // tick the clock every second

  // ---------- Floating musical notes (decorative background animation) ----------
  function spawnFloatingNotes() {
    const container = document.getElementById('floatingNotes');
    const glyphs = ['♪', '♫', '♬', '♩'];
    const count = 10;
    for (let i = 0; i < count; i++) {
      const span = document.createElement('span');
      span.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      span.style.left = Math.random() * 100 + 'vw';
      span.style.fontSize = (14 + Math.random() * 16) + 'px';
      span.style.animationDuration = (14 + Math.random() * 12) + 's';
      span.style.animationDelay = (Math.random() * 16) + 's';
      container.appendChild(span);
    }
  }
  spawnFloatingNotes();
</script>
</body>
</html>
